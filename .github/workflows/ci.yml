name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t url-shortener:ci .

      - name: Smoke test — image starts
        run: |
          docker run -d --name test-app -p 5000:5000 \
            -e DB_HOST=localhost \
            url-shortener:ci
          sleep 3
          docker logs test-app
          docker rm -f test-app
